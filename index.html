<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#303030" />
    <meta name="description" content="PartiuFacul: registre os seus horários, confirme o ônibus da faculdade com #PARTIU e veja quantos ônibus a viagem precisa." />
    <title>PartiuFacul</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="desktop">
      <aside class="about">
        <img src="assets/img/bus-logo.png" alt="" class="about-logo" />
        <h2>PartiuFacul</h2>
        <p>O app do ônibus da faculdade. Registre os seus horários, confirme a viagem com <strong>#PARTIU</strong> e veja quantos ônibus vão sair.</p>
        <p class="about-hint">No celular, abra esta página e use “Adicionar à tela inicial”.</p>
        <a href="https://github.com/rahelmartim/partiu-facul" target="_blank" rel="noopener noreferrer">Código no GitHub</a>
      </aside>
      <div class="phone">
        <div class="status-bar"></div>
        <main id="app" class="screen" tabindex="-1"></main>
        <nav id="tabbar" class="tabbar" aria-label="Menu" hidden></nav>
      </div>
    </div>
    <noscript>O PartiuFacul precisa de JavaScript.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
